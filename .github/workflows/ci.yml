name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +1.91.0 fmt --all -- --check
      - name: Debug tests
        run: cargo +1.91.0 test --locked -q
      - name: Release tests
        run: cargo +1.91.0 test --locked --release -q
      - name: Clippy
        run: cargo +1.91.0 clippy --locked --all-targets -- -D warnings
      - name: Optimized build
        run: cargo +1.91.0 build --locked --release
      - name: Dependency tree
        run: cargo +1.91.0 tree --locked
